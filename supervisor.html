<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supervisor | V5 Issue Tracker by Shareque</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">V5</div>
      <div>
        <div>V5 Issue Tracker</div>
        <div style="font-size:0.7rem;opacity:0.85;font-weight:500">by Shareque</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="badge" id="openBadge">0 open</span>
      <div class="nav-links">
        <a href="/supervisor">Supervisor</a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="mini-illustration">
      <div class="mini-item">🛵<span>Delivery</span></div>
      <div class="mini-item">🍔<span>Food</span></div>
      <div class="mini-item">🎧<span>Agent</span></div>
      <div class="mini-item">💻<span>Tech</span></div>
    </div>

    <div class="notification" id="notification">
      <span class="notification-icon">🔔</span>
      <span id="notifText">Loading notifications...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalOpen">0</div>
        <div class="stat-label">Total Open</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="openToday">0</div>
        <div class="stat-label">Open Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalToday">0</div>
        <div class="stat-label">Submitted Today</div>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Issues Dashboard</h2>

      <div class="toolbar">
        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="open" selected>Open</option>
          <option value="fixed">Fixed</option>
        </select>
        <input type="date" id="dateFilter">
        <button class="btn btn-secondary btn-sm" id="refreshBtn">Refresh</button>
        <button class="btn btn-primary btn-sm" id="exportBtn">Export Day to Excel (CSV)</button>
      </div>

      <div id="issueList" class="issue-list">
        <div class="empty-state">
          <div class="icon">📋</div>
          <div>Loading issues...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <strong>V5 Issue Tracker</strong> by Shareque
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const toast = document.getElementById('toast');
    let lastOpenCount = 0;

    function showToast(msg, type = 'success') {
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.classList.remove('show'), 3200);
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
